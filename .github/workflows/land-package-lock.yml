name: Land package-lock on main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile
        working-directory: docs
        run: |
          rm -f package-lock.json
          npm install --package-lock-only
          python3 -c "t=open('package-lock.json').read(); assert t.lstrip().startswith('{'); assert len(t)>50000; print('lock bytes', len(t))"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/package-lock.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "fix(docs): restore valid package-lock.json"
          git push origin HEAD:main
