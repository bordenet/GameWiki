name: Land package-lock on main

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/open-lock-restore-pr.yml

permissions:
  contents: write

jobs:
  land-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy lockfile from cursor/fix-lock-land-c170
        run: |
          set -euo pipefail
          git fetch origin cursor/fix-lock-land-c170
          git show FETCH_HEAD:docs/package-lock.json > docs/package-lock.json
          SIZE=$(wc -c < docs/package-lock.json | tr -d ' ')
          echo "lock bytes: $SIZE"
          test "$SIZE" -gt 100000
          test "$(head -c 1 docs/package-lock.json)" = '{'

      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/package-lock.json
          git diff --staged --quiet && echo "No lock change needed" && exit 0
          git commit -m "fix(deps): restore docs/package-lock.json for minimatch/glob overrides"
          git push origin HEAD:main
