name: restore-docs-package-lock
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-docs-package-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download good lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o docs/package-lock.json \
            https://raw.githubusercontent.com/bordenet/GameWiki/cursor/land-lockfile-minimatch-ce4a/docs/package-lock.json
          python3 -c "t=open('docs/package-lock.json').read(); assert t.lstrip().startswith('{'); assert len(t)>100000; print(len(t))"
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/package-lock.json; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/package-lock.json
          git commit -m "fix(deps): restore docs/package-lock.json for minimatch/glob overrides"
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm -f .github/workflows/restore-docs-package-lock.yml || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ci): remove one-shot lockfile restore workflow"
          git push
