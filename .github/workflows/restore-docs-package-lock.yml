name: restore-docs-package-lock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-docs-package-lock.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download good lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o docs/package-lock.json \
            https://raw.githubusercontent.com/bordenet/GameWiki/cursor/fix-lock-land-c170/docs/package-lock.json
          python3 -c "import json, pathlib; p=pathlib.Path('docs/package-lock.json'); t=p.read_text(); json.loads(t); assert len(t)>100000; print(len(t))"
      - name: Create PR with lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="cursor/fix-lock-land-c170-merge"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          if git diff --quiet -- docs/package-lock.json; then
            echo "No lockfile change versus checkout"
            exit 0
          fi
          git add docs/package-lock.json
          git commit -m "fix(deps): restore docs/package-lock.json for minimatch overrides"
          git push -f origin HEAD:"$BR"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BR" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            echo "PR #$existing already exists"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BR" \
            --title "fix(deps): restore docs/package-lock.json (minimatch 11.0.8)" \
            --body "Automated restore of full docs/package-lock.json from cursor/fix-lock-land-c170."
