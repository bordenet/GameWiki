name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      
      - name: Restore package-lock.json
        run: |
          if ! python3 -c "import json; json.load(open('package-lock.json'))" 2>/dev/null; then
            if ls ../.github/lock-restore/part0* 1>/dev/null 2>&1; then
              cat ../.github/lock-restore/part0{0..7} > package-lock.json
            else
              curl -fsSL -o package-lock.json \
                https://raw.githubusercontent.com/bordenet/GameWiki/4352c44c1b71e76d2fc9a6a16527a31225f646ef/docs/package-lock.json
            fi
          fi
          python3 -c "t=open('package-lock.json').read(); assert t.lstrip().startswith('{'); assert len(t)>100000"

      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

