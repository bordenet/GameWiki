name: land-lock-from-branch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-lock-from-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install lockfile from branch
        run: |
          set -euo pipefail
          curl -fsSL -o docs/package-lock.json \
            https://raw.githubusercontent.com/bordenet/GameWiki/cursor/fix-lock-land-c170/docs/package-lock.json
          python3 -c "t=open('docs/package-lock.json').read(); assert t.lstrip().startswith('{'); assert len(t)>100000; print(len(t))"
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/package-lock.json
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "fix(deps): restore docs/package-lock.json for minimatch/glob overrides"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: success()
        run: |
          set -euo pipefail
          git rm -f .github/workflows/land-lock-from-branch.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ci): remove one-shot land-lock-from-branch workflow"
          git push origin HEAD:main
